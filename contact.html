<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Suliman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 3rem;
      margin-top: 3rem;
    }

    @media (min-width: 800px) {
      .contact-grid { grid-template-columns: 1.2fr 1fr; gap: 4rem; }
    }

    .contact-form {
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-group label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--accent);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--fg);
      transition: all 0.15s;
    }

    body[lang="ar"] .form-group input,
    body[lang="ar"] .form-group textarea {
      font-family: var(--font-arabic);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 130px;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .contact-direct-label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
    }

    .contact-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.2rem;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s;
    }

    .contact-row:hover {
      border-color: var(--border-hover);
      background: rgba(255,255,255,0.06);
      transform: translateX(4px);
    }

    body[lang="ar"] .contact-row:hover { transform: translateX(-4px); }

    .contact-row-label {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--fg-subtle);
    }

    .contact-row-value {
      font-size: 0.9rem;
      color: var(--fg-muted);
      transition: color 0.15s;
    }

    .contact-row:hover .contact-row-value { color: var(--accent); }
  </style>
</head>
<body lang="en">
  <div class="bg-grid"></div>
  <div class="bg-spotlight"></div>
  <div class="bg-noise"></div>

  <div id="header-placeholder"></div>

  <main>
    <section>
      <div class="eyebrow" data-i18n="contact_eyebrow">Contact</div>
      <h1 data-i18n="contact_title">Let's talk</h1>
      <p style="margin-top: 1rem; max-width: 540px;" data-i18n="contact_subtitle">Open to internships, collaborations, and interesting problems.</p>

      <div class="contact-grid">
        <div class="contact-form">
          <div class="form-group">
            <label data-i18n="form_name">Name</label>
            <input type="text" id="name" required>
          </div>
          <div class="form-group">
            <label data-i18n="form_email">Email</label>
            <input type="email" id="email" required>
          </div>
          <div class="form-group">
            <label data-i18n="form_message">Message</label>
            <textarea id="message" required></textarea>
          </div>
          <div>
            <button type="button" class="btn btn-primary" onclick="handleSubmit()">
              <span data-i18n="form_submit">Send</span>
              <span class="arrow">→</span>
            </button>
          </div>
        </div>

        <div>
          <div class="contact-direct-label" data-i18n="contact_or">Or directly</div>
          <div class="contact-info">
            <a href="mailto:sulimanalhasann@gmail.com" target="_blank" class="contact-row">
              <span class="contact-row-label">email</span>
              <span class="contact-row-value">sulimanalhasann@gmail.com</span>
            </a>
            <a href="https://linkedin.com/in/sulimanalhasan" target="_blank" class="contact-row">
              <span class="contact-row-label">linkedin</span>
              <span class="contact-row-value">linkedin.com/in/sulimanalhasan</span>
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="partials.js"></script>
  <script src="script.js"></script>
  <script>
    function handleSubmit() {
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const message = document.getElementById('message').value;
      if (!name || !email || !message) return;
      const subject = encodeURIComponent(`Portfolio contact from ${name}`);
      const body = encodeURIComponent(`${message}\n\n— ${name}\n${email}`);
      window.location.href = `mailto:sulimanalhasann@gmail.com?subject=${subject}&body=${body}`;
    }
  </script>
</body>
</html>
