<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Suliman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--fg-muted);
      text-decoration: none;
      margin-bottom: 2rem;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--accent); }
    .back-link .arrow { transition: transform 0.2s; }
    .back-link:hover .arrow { transform: translateX(-3px); }
    body[lang="ar"] .back-link:hover .arrow { transform: translateX(3px); }

    .project-detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    #detail-year {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--fg-subtle);
      padding: 0.3rem 0.7rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 999px;
      flex-shrink: 0;
      margin-top: 0.5rem;
    }

    #detail-desc {
      max-width: 640px;
      font-size: 1.05rem;
      margin-bottom: 1.75rem;
    }

    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .detail-tags .project-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--fg-muted);
      padding: 0.25rem 0.65rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .detail-links {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 3.5rem;
      flex-wrap: wrap;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .gallery img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
      cursor: zoom-in;
      transition: border-color 0.2s, transform 0.2s;
      display: block;
    }

    .gallery img:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .gallery-empty {
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      color: var(--fg-subtle);
      font-size: 0.9rem;
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(5,5,8,0.9);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      padding: 2rem;
      cursor: zoom-out;
    }

    .lightbox.open { display: flex; }

    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body lang="en">
  <div class="bg-grid"></div>
  <div class="bg-spotlight"></div>
  <div class="bg-noise"></div>

  <div id="header-placeholder"></div>

  <main>
    <section>
      <a href="projects.html" class="back-link">
        <span class="arrow">←</span>
        <span data-i18n="nav_projects">Work</span>
      </a>

      <div class="project-detail-header">
        <h1 id="detail-title" style="font-size: clamp(2.4rem, 6vw, 4rem);"></h1>
        <span id="detail-year"></span>
      </div>

      <p id="detail-desc"></p>

      <div class="detail-tags" id="detail-tags"></div>

      <div class="detail-links" id="detail-links"></div>

      <div class="gallery" id="detail-gallery"></div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <div class="lightbox" id="lightbox">
    <img id="lightbox-img" src="" alt="">
  </div>

  <script src="partials.js"></script>
  <script src="script.js"></script>
  <script src="projects-data.js"></script>
  <script>
    const EMPTY_GALLERY_TEXT = {
      en: 'No photos added yet.',
      ar: 'ما فيه صور مضافة حتى الآن.',
    };
    const NOT_FOUND_TEXT = {
      en: 'Project not found.',
      ar: 'المشروع غير موجود.',
    };

    function currentLang() {
      return document.body.getAttribute('lang') || 'en';
    }

    function renderProject() {
      const id = new URLSearchParams(window.location.search).get('id');
      const data = PROJECTS.find((p) => p.id === id);
      const lang = currentLang();

      if (!data) {
        document.getElementById('detail-title').textContent = NOT_FOUND_TEXT[lang];
        document.getElementById('detail-desc').textContent = '';
        document.getElementById('detail-year').textContent = '';
        document.getElementById('detail-tags').innerHTML = '';
        document.getElementById('detail-links').innerHTML = '';
        document.getElementById('detail-gallery').innerHTML = '';
        return;
      }

      document.title = data.title[lang] + ' — Suliman';
      document.getElementById('detail-title').textContent = data.title[lang];
      document.getElementById('detail-desc').textContent = data.desc[lang];
      document.getElementById('detail-year').textContent = data.year;

      document.getElementById('detail-tags').innerHTML = data.tags
        .map((tag) => `<span class="project-tag">${tag}</span>`)
        .join('');

      const linkLabels = { github: 'github', demo: lang === 'ar' ? 'تجربة حية' : 'live demo' };
      document.getElementById('detail-links').innerHTML = Object.entries(data.links || {})
        .map(([type, url]) => `<a href="${url}" class="btn btn-ghost">${linkLabels[type] || type}</a>`)
        .join('');

      const gallery = document.getElementById('detail-gallery');
      if (data.images && data.images.length) {
        gallery.innerHTML = data.images
          .map((src) => `<img src="${src}" alt="" loading="lazy">`)
          .join('');
        gallery.querySelectorAll('img').forEach((img) => {
          img.addEventListener('click', () => openLightbox(img.src));
        });
      } else {
        gallery.innerHTML = `<div class="gallery-empty">${EMPTY_GALLERY_TEXT[lang]}</div>`;
      }
    }

    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('open');
    }

    document.getElementById('lightbox').addEventListener('click', () => {
      document.getElementById('lightbox').classList.remove('open');
    });

    document.addEventListener('DOMContentLoaded', renderProject);
    document.addEventListener('langchange', renderProject);
  </script>
</body>
</html>
